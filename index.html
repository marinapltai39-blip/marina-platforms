<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>منصات مارينا | الموقع الفني</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="منصات مارينا — الكتالوجات والفلايرات والعروض الفنية: مصاعد، منصات ذراعية ومقصية، أنظمة جراجات، سقالات، سلالم وأرصفة تحميل.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@300;400;500;700&family=Archivo:ital,wght@1,700;1,800&family=Inter:wght@400;500;700;800&display=swap">
<style>
  :root{
    --bg:#EEF1F6;--bg-2:#E3E8F0;--panel:#FFFFFF;--panel-2:#F5F7FB;
    --ink:#16193A;--ink-dim:#5A6180;--ink-faint:#8A90A8;
    --navy:#1E2A8C;--navy-2:#2A3AA8;--navy-deep:#141A57;
    --red:#C8102E;--red-2:#E11B36;
    --brand:#1E2A8C;--nav-bg:rgba(255,255,255,.92);--pattern:#1E2A8C;
    --line:rgba(30,42,140,.14);--line-soft:rgba(22,25,58,.09);
    --radius:10px;--maxw:1200px;--ease:cubic-bezier(.22,.61,.36,1);--shadow:0 20px 50px rgba(30,42,140,.12);
  }
  /* الوضع الغامق (تلقائي حسب النظام + التبديل اليدوي) */
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
    --bg:#0E1120;--bg-2:#141830;--panel:#191D36;--panel-2:#20264A;
    --ink:#EBEDF7;--ink-dim:#AEB4D4;--ink-faint:#7C83A6;
    --line:rgba(142,156,239,.22);--line-soft:rgba(200,208,240,.10);
    --shadow:0 20px 50px rgba(0,0,0,.55);--brand:#93A0F2;--nav-bg:rgba(14,17,32,.9);--pattern:#93A0F2;
  }}
  :root[data-theme="dark"]{
    --bg:#0E1120;--bg-2:#141830;--panel:#191D36;--panel-2:#20264A;
    --ink:#EBEDF7;--ink-dim:#AEB4D4;--ink-faint:#7C83A6;
    --line:rgba(142,156,239,.22);--line-soft:rgba(200,208,240,.10);
    --shadow:0 20px 50px rgba(0,0,0,.55);--brand:#93A0F2;--nav-bg:rgba(14,17,32,.9);--pattern:#93A0F2;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:
      radial-gradient(1100px 600px at 88% -10%, rgba(200,16,46,.06), transparent 60%),
      radial-gradient(900px 600px at 0% 0%, rgba(30,42,140,.07), transparent 55%),var(--bg);
    color:var(--ink);font-family:"Tajawal",system-ui,sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  html[lang=en] body{font-family:"Inter",system-ui,sans-serif}
  h1,h2,h3,h4{font-family:"Cairo",sans-serif;font-weight:800;line-height:1.15;text-wrap:balance;margin:0;color:var(--ink)}
  html[lang=en] h1,html[lang=en] h2,html[lang=en] h3,html[lang=en] h4{font-family:"Inter",sans-serif;font-weight:800}
  a{color:inherit;text-decoration:none}
  ::selection{background:rgba(30,42,140,.18)}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 26px}
  .eyebrow{font-family:"Cairo",sans-serif;font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:.72rem;color:var(--red)}
  html[lang=en] .eyebrow{font-family:"Inter",sans-serif}
  .rule{height:3px;width:60px;background:var(--red);border-radius:3px;margin-top:6px}
  .btn{font-family:"Cairo",sans-serif;font-weight:700;font-size:.88rem;padding:10px 20px;border-radius:8px;cursor:pointer;
    border:1.5px solid var(--brand);color:var(--brand);background:transparent;transition:all .3s var(--ease);display:inline-flex;gap:8px;align-items:center;justify-content:center}
  html[lang=en] .btn{font-family:"Inter",sans-serif}
  .btn:hover{background:var(--brand);color:#fff}
  .btn svg{width:16px;height:16px}
  .btn.solid{background:var(--red);border-color:var(--red);color:#fff}
  .btn.solid:hover{background:var(--red-2);border-color:var(--red-2)}

  header.nav{position:sticky;top:0;z-index:60;background:var(--nav-bg);backdrop-filter:blur(12px);border-bottom:1px solid var(--line-soft)}
  html[data-theme="dark"] .brand .logo-img{filter:brightness(0) invert(1)}
  @media (prefers-color-scheme:dark){html:not([data-theme="light"]) .brand .logo-img{filter:brightness(0) invert(1)}}
  .site-bg g{stroke:var(--pattern)}
  .nav-in{display:flex;align-items:center;justify-content:space-between;height:74px;gap:20px}
  .brand{display:flex;align-items:center;gap:12px;cursor:pointer}
  .brand .logo-img{height:44px;width:auto;display:block}
  nav.links{display:flex;gap:6px;align-items:center}
  nav.links a{font-family:"Cairo";font-weight:600;font-size:.92rem;color:var(--ink-dim);padding:8px 15px;border-radius:6px;transition:all .25s;cursor:pointer;white-space:nowrap}
  html[lang=en] nav.links a{font-family:"Inter",sans-serif}
  nav.links a:hover{color:var(--brand);background:rgba(142,156,239,.12)}
  nav.links a.active{color:#fff;background:var(--red)}
  .nav-right{display:flex;gap:10px;align-items:center}
  .lang-btn{font-family:"Cairo";font-weight:800;font-size:.8rem;color:var(--brand);background:var(--panel-2);border:1px solid var(--line-soft);
    border-radius:20px;padding:8px 13px;cursor:pointer;transition:all .25s;letter-spacing:.05em;display:inline-flex;align-items:center;gap:6px}
  .lang-btn:hover{border-color:var(--brand);background:var(--panel)}
  .lang-btn svg{width:16px;height:16px}
  .nav-search{position:relative}
  .nav-search input{font-family:"Tajawal";font-size:.9rem;color:var(--ink);background:var(--panel-2);border:1px solid var(--line-soft);
    border-radius:20px;padding-block:8px;padding-inline-start:16px;padding-inline-end:38px;width:170px;transition:border-color .3s,background .3s,width .3s}
  html[lang=en] .nav-search input{font-family:"Inter",sans-serif}
  .nav-search input::placeholder{color:var(--ink-faint)}
  .nav-search input:focus{outline:none;border-color:var(--brand);background:var(--panel);width:200px}
  .nav-search svg{position:absolute;inset-inline-end:13px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--ink-faint)}
  .nav-toggle{display:none;background:none;border:0;color:var(--brand);cursor:pointer}

  .hero{position:relative;padding:70px 0 56px;overflow:hidden}
  .hero-inner{position:relative;z-index:1;max-width:1040px}
  .hero h1{font-size:clamp(2.2rem,5vw,3.7rem);font-weight:900;letter-spacing:-.02em;margin-top:16px;text-wrap:normal;max-width:none}
  .hero h1 em{font-style:normal;color:var(--red)}
  .hero p.lead{font-size:1.12rem;color:var(--ink-dim);max-width:48ch;margin:18px 0 0}
  .cta-row{display:flex;gap:12px;margin-top:28px;flex-wrap:wrap}
  .stats{display:flex;gap:30px;margin-top:42px;flex-wrap:wrap}
  .stat b{font-family:"Cairo";font-weight:900;font-size:2rem;color:var(--brand);display:block;line-height:1;font-variant-numeric:tabular-nums}
  html[lang=en] .stat b{font-family:"Inter",sans-serif}
  .stat span{font-size:.82rem;color:var(--ink-faint);font-weight:600}
  .site-bg{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;opacity:.05;pointer-events:none}
  header.nav{position:sticky}main{position:relative;z-index:1}

  section.explorer{padding:26px 0 90px}
  .crumb{display:flex;gap:8px;align-items:center;font-family:"Cairo";font-weight:600;font-size:.9rem;color:var(--ink-faint);margin-bottom:18px;flex-wrap:wrap}
  html[lang=en] .crumb{font-family:"Inter",sans-serif}
  .crumb a{cursor:pointer;color:var(--brand)}.crumb a:hover{color:var(--red)}
  .crumb .sep{color:var(--ink-faint)}
  .exp-head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:24px;flex-wrap:wrap}
  .exp-head h2{font-size:clamp(1.6rem,3.4vw,2.3rem)}
  .exp-head p{color:var(--ink-dim);margin:8px 0 0;max-width:56ch}
  .back-btn{font-family:"Cairo";font-weight:700;font-size:.85rem;color:var(--brand);cursor:pointer;display:inline-flex;gap:6px;align-items:center;
    background:var(--panel);border:1px solid var(--line-soft);padding:8px 16px;border-radius:8px;transition:all .25s}
  html[lang=en] .back-btn{font-family:"Inter",sans-serif}
  .back-btn:hover{border-color:var(--brand)}
  .back-btn svg{transform:scaleX(1)}
  html[dir=ltr] .back-btn svg{transform:scaleX(-1)}

  .grid{display:grid;gap:22px;grid-template-columns:repeat(3,1fr)}

  .sec-card{position:relative;border:1px solid var(--line-soft);border-radius:14px;overflow:hidden;background:var(--panel);cursor:pointer;
    transition:transform .4s var(--ease),box-shadow .4s;min-height:210px;display:flex;flex-direction:column;justify-content:flex-end;padding:26px;color:#fff}
  .sec-card:hover{transform:translateY(-8px);box-shadow:var(--shadow)}
  .sec-card .sc-art{position:absolute;inset:0;z-index:0;width:100%;height:100%;object-fit:cover}
  .sec-card .sc-shade{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(20,26,60,.15),rgba(20,26,60,.78))}
  .sec-card .sc-content{position:relative;z-index:2}
  .sec-card .sc-en{font-family:"Archivo";font-style:italic;font-weight:800;font-size:.8rem;opacity:.85}
  .sec-card h3{color:#fff;font-size:1.6rem;margin:4px 0 6px}
  .sec-card .sc-count{font-family:"Cairo";font-weight:600;font-size:.85rem;opacity:.9}
  html[lang=en] .sec-card .sc-count{font-family:"Inter",sans-serif}
  .sec-card .sc-go{margin-top:14px;display:inline-flex;gap:8px;align-items:center;font-family:"Cairo";font-weight:700;font-size:.9rem;
    background:#fff;color:var(--navy);padding:9px 18px;border-radius:6px;align-self:flex-start}
  html[dir=ltr] .sec-card .sc-go svg{transform:scaleX(-1)}

  .cat-card{border:1px solid var(--line-soft);border-radius:12px;background:var(--panel);cursor:pointer;overflow:hidden;
    transition:transform .35s var(--ease),box-shadow .35s,border-color .35s;display:flex;flex-direction:column}
  .cat-card:hover{transform:translateY(-6px);box-shadow:var(--shadow);border-color:var(--line)}
  .cat-top{height:120px;display:grid;place-items:center;background:linear-gradient(150deg,var(--navy),var(--navy-deep));position:relative;overflow:hidden}
  .cat-top svg{width:52px;height:52px}
  .cat-top img.cat-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .cat-top .fbadge{position:absolute;top:10px;inset-inline-start:10px;z-index:2;background:rgba(20,26,60,.55);color:#fff;font-family:"Cairo";font-weight:700;font-size:.6rem;padding:3px 9px;border-radius:20px}
  html[lang=en] .cat-top .fbadge{font-family:"Inter",sans-serif}
  .cat-body{padding:15px 17px 17px}
  .cat-body .cat-en{font-family:"Archivo";font-style:italic;font-weight:800;font-size:.72rem;color:var(--red)}
  .cat-body h3{font-size:1.12rem;margin-top:2px}
  .cat-body .cnt{color:var(--ink-faint);font-size:.82rem;margin-top:4px;font-weight:500}
  html[lang=en] .cat-body .cnt{font-family:"Inter",sans-serif}

  .prod-card{border:1px solid var(--line-soft);border-radius:12px;background:var(--panel);overflow:hidden;display:flex;flex-direction:column;
    transition:transform .35s var(--ease),box-shadow .35s,border-color .35s}
  .prod-card:hover{transform:translateY(-6px);box-shadow:var(--shadow);border-color:var(--line)}
  .prod-cover{position:relative;height:140px;background:linear-gradient(150deg,var(--navy),var(--navy-deep));display:grid;place-items:center;cursor:pointer;color:#fff}
  .prod-cover .pdf-badge{position:absolute;top:11px;inset-inline-end:11px;background:var(--red);color:#fff;font-family:"Cairo";font-weight:700;font-size:.6rem;padding:4px 10px;border-radius:20px;letter-spacing:.05em}
  html[lang=en] .prod-cover .pdf-badge{font-family:"Inter",sans-serif}
  .prod-cover>svg{width:48px;height:48px;opacity:.92}
  .prod-cover .prod-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .prod-cover .open-ov{position:absolute;inset:0;display:grid;place-items:center;background:rgba(20,26,87,.5);opacity:0;transition:opacity .3s;backdrop-filter:blur(2px)}
  .prod-cover:hover .open-ov{opacity:1}
  .open-ov .fh{background:#fff;color:var(--navy);padding:9px 20px;border-radius:6px;font-family:"Cairo";font-weight:700;font-size:.85rem;display:flex;gap:8px;align-items:center}
  html[lang=en] .open-ov .fh{font-family:"Inter",sans-serif}
  .prod-body{padding:14px 15px 15px;display:flex;flex-direction:column;gap:11px;flex:1}
  .prod-body .pctx{font-family:"Cairo";font-weight:700;font-size:.64rem;color:var(--red);letter-spacing:.03em}
  html[lang=en] .prod-body .pctx{font-family:"Inter",sans-serif}
  .prod-body h3{font-size:1.0rem;font-weight:700;line-height:1.35}
  .prod-actions{display:flex;gap:7px;margin-top:auto}
  .prod-actions .btn{flex:1;padding:8px 8px;font-size:.78rem}
  .prod-actions .ib{flex:none;width:38px;padding:8px 0}

  .empty-state{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--ink-faint);background:var(--panel);border:1px dashed var(--line);border-radius:12px}
  .empty-state svg{width:44px;height:44px;color:var(--ink-faint);margin-bottom:12px}
  .empty-state b{display:block;color:var(--ink);font-family:"Cairo";font-size:1.1rem;margin-bottom:4px}
  html[lang=en] .empty-state b{font-family:"Inter",sans-serif}

  footer.foot{background:var(--navy-deep);color:rgba(255,255,255,.7);padding:34px 0;font-size:.85rem}
  .foot-in{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
  .foot-in .brand{cursor:default}
  .foot-in .flogo{height:34px;width:auto;display:block;filter:brightness(0) invert(1);opacity:.9}

  .viewer{position:fixed;inset:0;z-index:100;display:none;flex-direction:column;background:rgba(20,26,60,.8);backdrop-filter:blur(8px);padding:16px}
  .viewer.open{display:flex}
  .v-top{display:flex;justify-content:space-between;align-items:center;gap:14px;max-width:1080px;width:100%;margin:0 auto 10px}
  .v-title b{font-family:"Cairo";font-weight:800;font-size:1.2rem;display:block;color:#fff}
  html[lang=en] .v-title b{font-family:"Inter",sans-serif}
  .v-title span{color:rgba(255,255,255,.7);font-size:.82rem}
  .v-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .vbtn{height:40px;padding:0 15px;border-radius:22px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.12);color:#fff;cursor:pointer;display:inline-flex;gap:7px;align-items:center;transition:all .3s;font-family:"Cairo";font-weight:600;font-size:.83rem}
  html[lang=en] .vbtn{font-family:"Inter",sans-serif}
  .vbtn.round{width:40px;padding:0;justify-content:center;border-radius:50%}
  .vbtn:hover{background:#fff;color:var(--navy)}
  .vbtn svg{width:16px;height:16px}
  .pdf-stage{flex:1;max-width:1080px;width:100%;margin:0 auto;border-radius:10px;overflow:hidden;background:#525659;box-shadow:0 40px 90px rgba(0,0,0,.5)}
  .pdf-stage iframe{width:100%;height:100%;border:0}

  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:12px 24px;border-radius:8px;font-size:.9rem;font-weight:500;opacity:0;transition:all .4s var(--ease);z-index:200;pointer-events:none;box-shadow:var(--shadow)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media (max-width:900px){.hero-grid{grid-template-columns:1fr;gap:14px}.hero-visual{order:-1;height:250px}.hero-visual .big-gear{width:200px;height:200px}
    .grid{grid-template-columns:repeat(2,1fr)}nav.links,.nav-search{display:none}.nav-toggle{display:block}}
  @media (max-width:560px){.grid{grid-template-columns:1fr}.wrap{padding:0 16px}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <g id="gear-teeth"><path d="M50 2 C54 14 54 20 50 30 C46 20 46 14 50 2Z"/></g>
</defs></svg>

<header class="nav">
  <div class="wrap nav-in">
    <div class="brand" onclick="goHome()"><img class="logo-img" src="assets/logo-trim.png" alt="منصات مارينا · Marina Platforms"></div>
    <nav class="links" id="nav-links"></nav>
    <div class="nav-right">
      <button class="lang-btn" id="theme-btn" onclick="toggleTheme()" title="فاتح / غامق" aria-label="theme"></button>
      <button class="lang-btn" id="lang-btn" onclick="toggleLang()">EN</button>
      <div class="nav-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>
        <input id="search" type="search" aria-label="بحث">
      </div>
      <button class="nav-toggle" onclick="document.getElementById('explorer').scrollIntoView()" aria-label="menu"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    </div>
  </div>
</header>

<svg class="site-bg" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <g id="m-elevator" fill="none" stroke="#1E2A8C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 34 L44 20 L70 34 L70 82 L44 96 L18 82 Z"/><path d="M18 34 L44 48 L44 96 M44 48 L70 34"/><path d="M26 45 L40 52 L40 84 L26 78 Z"/></g>
      <g id="m-scissor" fill="none" stroke="#1E2A8C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
        <rect x="16" y="16" width="58" height="9" rx="1"/><path d="M24 27 L66 50 M66 27 L24 50 M24 50 L66 73 M66 50 L24 73"/><rect x="18" y="74" width="54" height="8" rx="1"/><circle cx="30" cy="90" r="5"/><circle cx="60" cy="90" r="5"/></g>
      <g id="m-boom" fill="none" stroke="#1E2A8C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="60" width="34" height="16" rx="2"/><circle cx="15" cy="82" r="5"/><circle cx="31" cy="82" r="5"/><path d="M34 62 L82 26"/><rect x="75" y="16" width="14" height="11" rx="1"/></g>
      <g id="m-scaffold" fill="none" stroke="#1E2A8C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 14 V86 M50 14 V86 M80 14 V86"/><path d="M20 32 H80 M20 54 H80 M20 76 H80"/><path d="M20 32 L50 54 M50 32 L80 54 M20 54 L50 76 M50 54 L80 76"/><path d="M16 14 H84"/><circle cx="20" cy="90" r="4"/><circle cx="80" cy="90" r="4"/></g>
      <g id="m-cradle" fill="none" stroke="#1E2A8C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 18 V34 M74 18 V34"/><path d="M16 18 H28 M68 18 H80"/><rect x="14" y="34" width="68" height="26" rx="2"/><path d="M14 47 H82"/></g>
      <pattern id="equip" width="300" height="220" patternUnits="userSpaceOnUse" patternTransform="rotate(-8)">
        <use href="#m-elevator" transform="translate(4,6) scale(.5)"/>
        <use href="#m-scissor" transform="translate(120,4) scale(.5)"/>
        <use href="#m-cradle" transform="translate(220,20) scale(.5)"/>
        <use href="#m-scaffold" transform="translate(40,118) scale(.5)"/>
        <use href="#m-boom" transform="translate(165,120) scale(.5)"/>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="url(#equip)"/>
</svg>

<main>
<section class="hero" id="home">
  <div class="wrap hero-inner">
    <span class="eyebrow" id="hero-eyebrow"></span><div class="rule"></div>
    <h1 id="hero-h1"></h1>
    <p class="lead" id="hero-lead"></p>
    <div class="cta-row">
      <button class="btn solid" id="cta-browse" onclick="document.getElementById('explorer').scrollIntoView()"></button>
    </div>
    <div class="stats" id="stats"></div>
  </div>
</section>

<section class="explorer" id="explorer">
  <div class="wrap">
    <div class="crumb" id="crumb"></div>
    <div class="exp-head" id="exp-head"></div>
    <div class="grid" id="exp-grid"></div>
  </div>
</section>

<footer class="foot"><div class="wrap foot-in">
  <div class="brand"><img class="flogo" src="assets/logo-trim.png" alt="Marina Platforms"></div>
  <div style="display:flex;gap:18px;align-items:center"><span id="foot-rights"></span><a href="admin.html" style="color:rgba(255,255,255,.55);font-size:.8rem;font-family:'Cairo',sans-serif;font-weight:700">لوحة التحكم</a></div>
</div></footer>
</main>

<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="viewer">
  <div class="v-top">
    <div class="v-title"><b id="v-name">—</b><span id="v-sub">—</span></div>
    <div class="v-actions">
      <a class="vbtn" id="v-dl" download><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3v13M7 11l5 5 5-5M5 21h14"/></svg> <span id="v-dl-txt"></span></a>
      <a class="vbtn" id="v-open" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg> <span id="v-open-txt"></span></a>
      <button class="vbtn round" title="close" onclick="closeViewer()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
  </div>
  <div class="pdf-stage"><iframe id="pdf-frame" title="PDF"></iframe></div>
</div>

<div class="toast" id="toast"></div>

<script src="manifest.js"></script>
<script>
const DATA=(window.MARINA_DATA&&window.MARINA_DATA.tree)?window.MARINA_DATA:{tree:[]};

/* ===================== الترجمة (عربي/إنجليزي) ===================== */
const T={
  ar:{dir:"rtl",
    eyebrow:"الموقع الفنّي",
    h1:'كتالوجات وفلايرات <em>شركة مارينا</em> في مكان واحد.',
    lead:"مصاعد، منصات ذراعية ومقصية، أنظمة جراجات، سقالات، سلالم وأرصفة تحميل. تصفّح كل الملفات الفنية وحمّلها مباشرة.",
    browse:"تصفّح الأقسام", badge1:"ارتفاع حتى ٤٥م", badge2:"بيع وإيجار",
    statCat:"كتالوج", statTech:"عرض فني", statFly:"فلاير",
    home:"الرئيسية", searchPh:"بحث…",
    mainEye:"تصفّح", mainTitle:"الأقسام الرئيسية", mainSub:"اختر القسم لتصفّح الفئات والملفات الفنية.",
    chooseSub:"اختر فئة فرعية", or:" أو ", filesN:"ملف — اضغط للتصفّح", noContent:"لا يوجد محتوى بعد.",
    categories:"فئات", files:"ملف", soon:"قريبًا", enter:"دخول", back:"رجوع", browseCard:"تصفّح",
    resultsCrumb:"نتائج البحث", resultsTitle:"نتائج", matchN:"ملف مطابق", noResults:"لا نتائج", tryOther:"جرّب كلمة أخرى.",
    noFiles:"لا توجد ملفات بعد", dropHint:"ضع ملفات PDF في الفولدر المناسب داخل files/.",
    dlWord:"تحميل Word", dlPdf:"تحميل", newTab:"تبويب جديد",
    rights:"© ٢٠٢٦ مارينا — جميع الحقوق محفوظة."},
  en:{dir:"ltr",
    eyebrow:"Technical Site",
    h1:'Catalogues & flyers of <em>Marina Company</em> in one place.',
    lead:"Elevators, boom & scissor lifts, parking systems, scaffolding, ladders and dock levelers. Browse and download all technical files directly.",
    browse:"Browse sections", badge1:"Up to 45 m", badge2:"Sale & Rental",
    statCat:"Catalogues", statTech:"Technical Offers", statFly:"Flyers",
    home:"Home", searchPh:"Search…",
    mainEye:"Browse", mainTitle:"Main Sections", mainSub:"Choose a section to browse its categories and technical files.",
    chooseSub:"Choose a sub-category", or:" or ", filesN:"files — click to view", noContent:"No content yet.",
    categories:"categories", files:"files", soon:"Soon", enter:"Enter", back:"Back", browseCard:"View",
    resultsCrumb:"Search results", resultsTitle:"Results", matchN:"matching files", noResults:"No results", tryOther:"Try another keyword.",
    noFiles:"No files yet", dropHint:"Place PDF files in the appropriate folder under files/.",
    dlWord:"Download Word", dlPdf:"Download", newTab:"New tab",
    rights:"© 2026 Marina — All rights reserved."}
};
let lang="ar";
try{const s=localStorage.getItem("marina-lang");if(s==="ar"||s==="en")lang=s;}catch(e){}
const t=k=>T[lang][k];
const AR=n=>String(n).replace(/\d/g,d=>"٠١٢٣٤٥٦٧٨٩"[d]);
const NUM=n=>lang==="ar"?AR(n):String(n);
const titleCase=s=>String(s).replace(/\b\w/g,c=>c.toUpperCase());
const L=node=>lang==="ar"?node.label:titleCase(node.en||node.label);

function buildGear(el,teeth=10){if(!el)return;let s="";for(let i=0;i<teeth;i++)s+=`<use href="#gear-teeth" fill="var(--navy)" transform="rotate(${i*(360/teeth)} 50 50)"/>`;
  el.innerHTML=s+`<circle cx="50" cy="50" r="30" fill="var(--navy)"/><circle cx="50" cy="50" r="21" fill="#fff"/>`;}
function toast(m){const el=document.getElementById("toast");el.textContent=m;el.classList.add("show");clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove("show"),2600);}

const ICONS={
  elevator:`<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5"><rect x="5" y="2.5" width="14" height="19" rx="1"/><path d="M12 5v14M9 8l3-2.5L15 8M9 16l3 2.5L15 16"/></svg>`,
  boom:`<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5"><rect x="3" y="15" width="9" height="5" rx="1"/><circle cx="5.5" cy="21.3" r="1.5"/><circle cx="9.5" cy="21.3" r="1.5"/><path d="M10 15L19 6"/><rect x="17" y="3" width="5" height="4" rx="1"/></svg>`,
  scissor:`<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5"><rect x="7" y="3" width="10" height="3"/><path d="M8 6l8 6M16 6l-8 6M8 12l8 6M16 12l-8 6"/><path d="M5 20h14"/></svg>`,
  parking:`<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 17V7h4a3 3 0 0 1 0 6H9"/></svg>`,
  cradle:`<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5"><path d="M3 4h18M6 4v3M18 4v3"/><path d="M7 7l-1 8h12l-1-8"/><path d="M6 15v4h12v-4"/></svg>`,
  scaffold:`<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5"><path d="M5 4v16M12 4v16M19 4v16M5 9h14M5 15h14"/></svg>`,
  ladder:`<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5"><path d="M8 2v20M16 2v20M8 6h8M8 10h8M8 14h8M8 18h8"/></svg>`,
  dock:`<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5"><path d="M3 20h18M5 20v-8h9l4 4v4"/><path d="M3 12l6-4h5"/></svg>`,
  custom:`<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4l-6 6 2 2 6-6a4 4 0 0 0 5.4-5.4l-2.3 2.3-2-2z"/></svg>`,
  folder:`<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>`
};
const secGrad=`<svg class="sc-art" viewBox="0 0 400 210" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><rect width="400" height="210" fill="url(#gr)"/><defs><linearGradient id="gr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1E2A8C"/><stop offset="1" stop-color="#141A57"/></linearGradient></defs><g stroke="#fff" stroke-opacity=".14" fill="none" stroke-width="1.4"><circle cx="330" cy="55" r="62"/><circle cx="330" cy="55" r="42"/><path d="M330 -12v134M266 55h128M285 11l90 90M375 11l-90 90"/></g></svg>`;
const secGradRed=secGrad.replace(/#1E2A8C/,'#C8102E').replace(/#141A57/,'#8a0b20');

function countFiles(nodes){let n=0;for(const x of nodes){if(x.type==="file")n++;else n+=countFiles(x.children);}return n;}
function topByEn(prefix){return DATA.tree.find(n=>n.type==="folder"&&(n.en||"").toLowerCase().startsWith(prefix));}

/* ---- state ---- */
let state={path:[],query:""};
function levelAt(pathArr){let lvl=DATA.tree;const chain=[];for(const i of pathArr){const node=lvl[i];if(!node||node.type!=="folder")break;chain.push(node);lvl=node.children;}return{chain,children:lvl};}

function buildNav(){
  const tops=DATA.tree.map((n,i)=>n.type==="folder"?`<a onclick="goPath([${i}])" data-i="${i}">${L(n)}</a>`:"").join("");
  document.getElementById("nav-links").innerHTML=`<a onclick="goHome()" data-i="home">${t("home")}</a>`+tops;
  setActiveNav();
}
function setActiveNav(){const cur=state.query?"-":(state.path.length?String(state.path[0]):"home");
  document.querySelectorAll("#nav-links a").forEach(a=>a.classList.toggle("active",a.dataset.i===cur));}

function goHome(){state={path:[],query:""};document.getElementById("search").value="";sync();document.getElementById("explorer").scrollIntoView();}
function goPath(arr){state={path:arr.slice(),query:""};document.getElementById("search").value="";sync();document.getElementById("explorer").scrollIntoView();}
function openChild(i){goPath(state.path.concat(i));}
function crumbTo(depth){goPath(state.path.slice(0,depth));}
function goBack(){goPath(state.path.slice(0,-1));}
function sync(){render();setActiveNav();history.replaceState(null,"",state.query?"#search":("#/"+state.path.join("/")));}

function crumbHTML(chain){
  let h=`<a onclick="goHome()">${t("home")}</a>`;
  chain.forEach((n,idx)=>{const last=idx===chain.length-1;
    h+=`<span class="sep">/</span>`+(last?`<span>${L(n)}</span>`:`<a onclick="crumbTo(${idx+1})">${L(n)}</a>`);});
  return h;
}
const arrow=`<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6l-6 6 6 6"/></svg>`;

function folderCard(node,i,big){
  const cnt=countFiles(node.children);
  if(big){
    const art=node.image?`<img class="sc-art" src="${node.image}" alt="">`:((i%2===1)?secGradRed:secGrad);
    return `<article class="sec-card" onclick="openChild(${i})">${art}<div class="sc-shade"></div><div class="sc-content">
      <div class="sc-en">${node.en||""}</div><h3>${L(node)}</h3>
      <div class="sc-count">${NUM(cnt)} ${t("files")}</div>
      <span class="sc-go">${t("enter")} ${arrow}</span></div></article>`;
  }
  const subFolders=node.children.filter(c=>c.type==="folder").length;
  const top=node.image?`<img class="cat-img" src="${node.image}" alt="">`:(ICONS[node.icon]||ICONS.folder);
  return `<article class="cat-card" onclick="openChild(${i})"><div class="cat-top">${top}
    ${subFolders?`<span class="fbadge">${NUM(subFolders)} ${t("categories")}</span>`:""}</div>
    <div class="cat-body"><div class="cat-en">${node.en||""}</div><h3>${L(node)}</h3>
    <div class="cnt">${cnt?NUM(cnt)+" "+t("files"):t("soon")}</div></div></article>`;
}
function productCard(node,ctx){
  const j=s=>String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/"/g,'&quot;');
  const dl=node.download||node.file, isWord=!!node.download;
  const open=`openViewer('${j(node.file)}','${j(node.title)}','${j(ctx)}','${j(dl)}',${isWord})`;
  return `<article class="prod-card">
    <div class="prod-cover" onclick="${open}">${node.image?`<img class="prod-img" src="${node.image}" alt="" loading="lazy">`:""}<span class="pdf-badge">${isWord?'WORD':'PDF'}</span>
      ${node.image?"":`<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.4"><path d="M7 3h7l4 4v14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v4h4"/><path d="M9 13h6M9 17h6"/></svg>`}
      <div class="open-ov"><span class="fh"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg> ${t("browseCard")}</span></div></div>
    <div class="prod-body"><div class="pctx">${ctx}</div><h3>${node.title}</h3>
      <div class="prod-actions">
        <button class="btn solid" onclick="${open}">${t("browseCard")}</button>
        <a class="btn ib" title="${isWord?t('dlWord'):t('dlPdf')}" href="${dl}" download><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3v13M7 11l5 5 5-5M5 21h14"/></svg></a>
      </div></div></article>`;
}
function emptyState(title,msg){return `<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M7 3h7l4 4v14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z"/><path d="M14 3v4h4"/></svg><b>${title}</b><span>${msg}</span></div>`;}

function render(){
  const crumb=document.getElementById("crumb"),head=document.getElementById("exp-head"),grid=document.getElementById("exp-grid");
  if(state.query.trim()){
    const q=state.query.trim().toLowerCase();const res=[];
    (function rec(nodes,ctx){for(const n of nodes){if(n.type==="file"){if((n.title+" "+ctx).toLowerCase().includes(q))res.push({n,ctx});}
      else rec(n.children,ctx?ctx+" › "+L(n):L(n));}})(DATA.tree,"");
    crumb.innerHTML=`<a onclick="goHome()">${t("home")}</a><span class="sep">/</span><span>${t("resultsCrumb")}</span>`;
    head.innerHTML=`<div><span class="eyebrow">${t("resultsTitle")}</span><h2 style="margin-top:8px">«${state.query}»</h2><p>${NUM(res.length)} ${t("matchN")}.</p></div>`;
    grid.innerHTML=res.length?res.map(r=>productCard(r.n,r.ctx)).join(""):emptyState(t("noResults"),t("tryOther"));
    return;
  }
  const{chain,children}=levelAt(state.path);
  const folders=children.filter(c=>c.type==="folder"),files=children.filter(c=>c.type==="file");
  const ctx=chain.map(c=>L(c)).join(" › ");
  crumb.innerHTML=state.path.length?crumbHTML(chain):`<span>${t("home")}</span>`;
  if(!state.path.length){
    head.innerHTML=`<div><span class="eyebrow">${t("mainEye")}</span><h2 style="margin-top:8px">${t("mainTitle")}</h2><p>${t("mainSub")}</p></div>`;
  }else{
    const cur=chain[chain.length-1];
    const parts=[];
    if(folders.length)parts.push(t("chooseSub"));
    if(files.length)parts.push(NUM(files.length)+" "+t("filesN"));
    const sub=parts.length?parts.join(t("or")):t("noContent");
    head.innerHTML=`<div><span class="eyebrow">${cur.en||""}</span><h2 style="margin-top:8px">${L(cur)}</h2><p>${sub}</p></div>
      <div class="back-btn" onclick="goBack()"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg> ${t("back")}</div>`;
  }
  const big=state.path.length===0;
  let html=folders.map((n,idx)=>folderCard(n,idx,big)).join("");
  html+=files.map(n=>productCard(n,ctx)).join("");
  if(!html)html=emptyState(t("noFiles"),t("dropHint"));
  grid.innerHTML=html;
}

/* ---- viewer ---- */
function openViewer(file,title,sub,dlUrl,isWord){
  document.getElementById("v-name").textContent=title;
  document.getElementById("v-sub").textContent=sub||"";
  document.getElementById("pdf-frame").src=file+"#view=FitH";
  const dl=document.getElementById("v-dl");dl.href=dlUrl||file;dl.setAttribute("download","");
  document.getElementById("v-dl-txt").textContent=isWord?t("dlWord"):t("dlPdf");
  document.getElementById("v-open").href=file;
  document.getElementById("viewer").classList.add("open");document.body.style.overflow="hidden";
}
function closeViewer(){document.getElementById("viewer").classList.remove("open");document.getElementById("pdf-frame").src="";document.body.style.overflow="";}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&document.getElementById("viewer").classList.contains("open"))closeViewer();});

/* ---- language ---- */
function applyLang(){
  document.documentElement.lang=lang;document.documentElement.dir=t("dir");
  document.getElementById("lang-btn").textContent=lang==="ar"?"EN":"ع";
  document.getElementById("hero-eyebrow").textContent=t("eyebrow");
  document.getElementById("hero-h1").innerHTML=t("h1");
  document.getElementById("hero-lead").textContent=t("lead");
  document.getElementById("cta-browse").textContent=t("browse");
  document.getElementById("search").placeholder=t("searchPh");
  document.getElementById("v-open-txt").textContent=t("newTab");
  document.getElementById("foot-rights").textContent=t("rights");
  const c=countFiles(topByEn("catalogue")?.children||[]);
  const f=countFiles(topByEn("flyers")?.children||[]);
  const g=countFiles(topByEn("technical")?.children||[]);
  const stat=(n,l)=>`<div class="stat"><b>${NUM(n)}</b><span>${l}</span></div>`;
  document.getElementById("stats").innerHTML=stat(c,t("statCat"))+stat(g,t("statTech"))+stat(f,t("statFly"));
  buildNav();render();
}
function toggleLang(){lang=lang==="ar"?"en":"ar";try{localStorage.setItem("marina-lang",lang);}catch(e){}applyLang();}

/* ---- theme (فاتح/غامق) ---- */
const SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>';
function effTheme(){const d=document.documentElement.getAttribute("data-theme");return d||(matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");}
function themeIcon(){const b=document.getElementById("theme-btn");if(b)b.innerHTML=effTheme()==="dark"?SUN:MOON;}
function toggleTheme(){const next=effTheme()==="dark"?"light":"dark";document.documentElement.setAttribute("data-theme",next);try{localStorage.setItem("marina-theme",next);}catch(e){}themeIcon();}
try{const s=localStorage.getItem("marina-theme");if(s)document.documentElement.setAttribute("data-theme",s);}catch(e){}
themeIcon();

/* ---- init ---- */
document.getElementById("search").addEventListener("input",e=>{state.query=e.target.value;if(state.query)state.path=[];sync();});
(function(){const h=location.hash.replace(/^#\//,"");
  if(location.hash!=="#search"){const parts=h.split("/").filter(s=>s!=="").map(Number).filter(n=>!isNaN(n));const{children}=levelAt(parts);if(children)state.path=parts;}
})();
applyLang();
</script>
</body>
</html>
